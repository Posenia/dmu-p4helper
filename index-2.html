<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>絶妖星乱舞 P4 ヘルパー 完全版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.15rem;
            color: #e94560;
            margin: 0;
            text-align: left;
        }

        .reset {
            flex: none !important;
            display: inline-block;
            width: auto;
            min-width: auto;
            margin: 0;
            padding: 7px 10px;
            background: rgba(233, 69, 96, 0.12);
            color: #e94560;
            border: 1.5px solid #e94560;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.3;
            height: auto;
            cursor: pointer;
        }

        .reset:active {
            background: rgba(233, 69, 96, 0.15);
        }

        .section {
            display: flex;
            width: 100%;
            max-width: 420px;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            background: #16213e;
        }

        .side-title {
            width: 28px;
            background: rgb(36, 49, 78);
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
            flex-shrink: 0;
        }
        .sec-flame .side-title {
            background: #c45c6a;
        }
        .sec-tsunami .side-title {
            background: #5c80c4;
        }

        .body {
            flex: 1;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 0.72rem;
            color: #a0aec0;
            margin-bottom: 2px;
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        button {
            flex: 1;
            min-width: 0;
            padding: 14px 4px;
            font-size: 0.88rem;
            font-weight: bold;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* 未選択：暗め */
        .btn-true {
            background: #2a6b4a;
            color: #fff;
        }

        .btn-false {
            background: #8a3a3a;
            color: #fff;
        }

        .btn-debuff {
            background: #2f5a7a;
            color: #fff;
        }

        /* 選択中：明るく */
        .btn-true.active {
            background: #2ecc71;
        }

        .btn-false.active {
            background: #e74c3c;
        }

        .btn-debuff.active {
            background: #3498db;
        }

        /* 真偽ペアで一方が選ばれた時、もう一方を薄くする（disabledと同じ見た目） */
        .btn-inactive {
            opacity: 0.35;
        }

        .btn-icon {
            padding: 8px 4px;
        }

        .btn-icon img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .result-box {
            padding: 11px 6px;
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            background: #3d4f66;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.25;
            color: #fff;
        }

        .sec-magicout .result-box {
            margin-top: 3px;
        }

        .result-box.green {
            background: #3d4f66;
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .result-box.orange {
            background: #3d4f66;
            border-color: #f39c12;
            color: #f39c12;
        }

        .result-box.blue {
            background: #3d4f66;
            border-color: #3498db;
            color: #3498db;
        }

        .result-box.purple {
            background: #3d4f66;
            border-color: #9b59b6;
            color: #9b59b6;
        }

        .result-box.cyan {
            background: #3d4f66;
            border-color: #1abc9c;
            color: #1abc9c;
        }

        .result-box.green,
        .result-box.orange,
        .result-box.blue,
        .result-box.purple,
        .result-box.cyan {
            background: radial-gradient(black, transparent);
            border-width: 3px;
        }

        .sec-magicout .result-box.green,
        .sec-magicout .result-box.orange,
        .sec-magicout .result-box.blue,
        .sec-magicout .result-box.purple,
        .sec-magicout .result-box.cyan {
            color: #ffffff;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .col-left {
            flex: 1.15;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .magic-pair {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .magic-pair>div {
            flex: 1;
        }

        .magic-pair .label {
            font-size: 0.7rem;
            margin-bottom: 3px;
            min-height: 1.2em;
            line-height: 1.2;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

        <h1>絶妖星乱舞 P4 ヘルパー</h1>
        <button class="reset" onclick="resetAll()">🔄 リセット</button>
    </div>
